services:
  - type: web
    name: wwcs
    runtime: node
    plan: free
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wwcs-db
          property: connectionString

databases:
  - name: wwcs-db
    databaseName: wwcs
    user: wwcs
    plan: free
