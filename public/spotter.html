<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotter Sign In / Register — WWCS</title>
<link rel="icon" type="image/webp" href="icon.webp">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="index.html"><img src="icon.webp" alt="WWCS logo">
      <span><span class="name">WWCS</span><br><span class="tag">Washington Weather and Climate Services</span></span></a>
    <nav class="main" id="mainnav"></nav>
    <span class="userbox" id="userbox"></span>
  </div>
</header>
<main>
  <div class="grid">
    <section class="card">
      <h2>Register as a Weather Spotter</h2>
      <p>Free. Post observations, publish to the blog, and join the live chat.</p>
      <div class="error" id="regerr" style="display:none"></div>
      <div class="notice" id="regok" style="display:none"></div>
      <form id="regform">
        <label for="rname">Full name</label>
        <input id="rname" required autocomplete="name">
        <label for="remail">Email</label>
        <input id="remail" type="email" required autocomplete="email" placeholder="you@example.com">
        <label for="rcounty">County (optional)</label>
        <input id="rcounty" placeholder="e.g. King">
        <label for="rpass">Password (min 8 characters)</label>
        <input id="rpass" type="password" required minlength="8" autocomplete="new-password">
        <button class="btn" type="submit">Create spotter account</button>
      </form>
      <p class="radar-legend">Your email is used only to sign you in. We never share it or send marketing mail.</p>
    </section>

    <section class="card">
      <h2>Sign In</h2>
      <div class="error" id="loginerr" style="display:none"></div>
      <form id="loginform">
        <label for="lemail">Email</label>
        <input id="lemail" type="email" required autocomplete="email">
        <label for="lpass">Password</label>
        <input id="lpass" type="password" required autocomplete="current-password">
        <button class="btn" type="submit">Sign in</button>
      </form>
    </section>
  </div>
</main>
<footer>WWCS · Community weather for Washington State</footer>
<script src="auth.js"></script>
<script>
renderHeader('spotter.html');

document.getElementById('regform').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('regerr'), ok = document.getElementById('regok');
  showError(err, ''); showError(ok, '');
  try {
    const { user } = await api('/api/register', { method: 'POST', body: JSON.stringify({
      name: document.getElementById('rname').value,
      email: document.getElementById('remail').value,
      county: document.getElementById('rcounty').value,
      password: document.getElementById('rpass').value,
    })});
    showError(ok, `Welcome, ${user.name}! You're signed in.`);
    setTimeout(() => location.href = 'spotters.html', 900);
  } catch (ex) { showError(err, ex.message); }
});

document.getElementById('loginform').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('loginerr');
  showError(err, '');
  try {
    await api('/api/login', { method: 'POST', body: JSON.stringify({
      email: document.getElementById('lemail').value,
      password: document.getElementById('lpass').value,
    })});
    location.href = 'spotters.html';
  } catch (ex) { showError(err, ex.message); }
});
</script>
</body>
</html>
