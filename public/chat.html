<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b3d5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WWCS">
<link rel="apple-touch-icon" href="/icon-192.png">
<script src="/pwa.js" defer></script>
<title>Live Chat — WWCS</title>
<link rel="icon" type="image/webp" href="icon.webp">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="index.html"><img src="icon.webp" alt="WWCS logo">
      <span><span class="name">WWCS</span><br><span class="tag">Washington Weather and Climate Services</span></span></a>
    <nav class="main" id="mainnav"></nav>
    <span class="userbox" id="userbox"></span>
  </div>
</header>
<main>
  <section class="card">
    <h2>💬 Live Chat</h2>
    <p class="radar-legend">Be kind. Chat is AI-moderated: profanity, slurs, spam, and flooding are blocked automatically.
      Signed-in spotters post under their name; guests post as “Guest”.</p>
    <div class="error" id="chaterr" style="display:none"></div>
    <div id="chatlog" aria-live="polite"></div>
    <form id="chatform" class="form-row" style="align-items:flex-end">
      <div style="flex:1 1 300px">
        <label for="chatinput">Message (max 500 characters)</label>
        <input id="chatinput" maxlength="500" placeholder="What's the sky doing where you are?" autocomplete="off">
      </div>
      <div style="flex:0 0 auto"><button class="btn" type="submit">Send</button></div>
    </form>
  </section>
</main>
<footer>WWCS · Community weather for Washington State</footer>
<script src="auth.js"></script>
<script>
renderHeader('chat.html');
const log = document.getElementById('chatlog');
const err = document.getElementById('chaterr');
let lastSeen = null;

function renderMsg(m) {
  const div = document.createElement('div');
  div.className = 'msg';
  div.innerHTML = `<span class="who">${escapeHtml(m.display_name)}</span><span class="when">${fmtDate(m.created_at)}</span><br>${escapeHtml(m.body)}`;
  return div;
}

async function poll() {
  try {
    const url = lastSeen ? `/api/chat?since=${encodeURIComponent(lastSeen)}` : '/api/chat';
    const { messages } = await api(url);
    if (!lastSeen) log.innerHTML = '';
    for (const m of messages) log.appendChild(renderMsg(m));
    if (messages.length) {
      lastSeen = messages[messages.length - 1].created_at;
      log.scrollTop = log.scrollHeight;
    }
  } catch { /* keep polling */ }
}

document.getElementById('chatform').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('chatinput');
  showError(err, '');
  const text = input.value.trim();
  if (!text) return;
  try {
    await api('/api/chat', { method: 'POST', body: JSON.stringify({ body: text }) });
    input.value = '';
    poll();
  } catch (ex) {
    showError(err, ex.message);
  }
});

poll();
setInterval(poll, 4000);
</script>
</body>
</html>
